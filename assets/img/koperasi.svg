<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="100%" height="100%">
  <defs>
    <linearGradient id="wall-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="wood-shelf" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="counter-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <pattern id="awning-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="20" height="40" fill="#EF4444"/>
      <rect x="20" width="20" height="40" fill="#FFFFFF"/>
    </pattern>
  </defs>

  <!-- Latar Dinding Toko Koperasi -->
  <rect x="10" y="10" width="480" height="280" rx="16" fill="url(#wall-grad)" stroke="#BFDBFE" stroke-width="3"/>

  <!-- Papan Nama Toko Koperasi -->
  <rect x="100" y="22" width="300" height="38" rx="8" fill="#1E3A8A" stroke="#F59E0B" stroke-width="2"/>
  <text x="250" y="47" font-family="'Fredoka', cursive, sans-serif" font-size="18" font-weight="900" fill="#FBBF24" text-anchor="middle" letter-spacing="1">
    🏪 KOPERASI SEKOLAH KREASI 🏪
  </text>

  <!-- Tenda Kanopi Belanja (Awning Striped) -->
  <path d="M40 65 L460 65 L445 105 L55 105 Z" fill="url(#awning-pattern)" stroke="#DC2626" stroke-width="2"/>
  <!-- Lekukan Tenda Bawah -->
  <g fill="#EF4444">
    <path d="M55 105 Q67 116 80 105 Z"/>
    <path d="M80 105 Q92 116 105 105 Z" fill="#FFFFFF"/>
    <path d="M105 105 Q117 116 130 105 Z"/>
    <path d="M130 105 Q142 116 155 105 Z" fill="#FFFFFF"/>
    <path d="M155 105 Q167 116 180 105 Z"/>
    <path d="M180 105 Q192 116 205 105 Z" fill="#FFFFFF"/>
    <path d="M205 105 Q217 116 230 105 Z"/>
    <path d="M230 105 Q242 116 255 105 Z" fill="#FFFFFF"/>
    <path d="M255 105 Q267 116 280 105 Z"/>
    <path d="M280 105 Q292 116 305 105 Z" fill="#FFFFFF"/>
    <path d="M305 105 Q317 116 330 105 Z"/>
    <path d="M330 105 Q342 116 355 105 Z" fill="#FFFFFF"/>
    <path d="M355 105 Q367 116 380 105 Z"/>
    <path d="M380 105 Q392 116 405 105 Z" fill="#FFFFFF"/>
    <path d="M405 105 Q417 116 430 105 Z"/>
    <path d="M430 105 Q442 116 445 105 Z" fill="#FFFFFF"/>
  </g>

  <!-- Rak Display Kayu Belakang (Tempat Stik & Prakarya) -->
  <rect x="50" y="118" width="180" height="12" rx="3" fill="url(#wood-shelf)"/>
  <rect x="50" y="168" width="180" height="12" rx="3" fill="url(#wood-shelf)"/>

  <!-- Barang di Rak Atas: Botol Lem & Wadah Stik Warna -->
  <!-- Toples Stik Kayu Polos -->
  <rect x="65" y="85" width="30" height="34" rx="4" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
  <rect x="70" y="70" width="4" height="28" rx="1.5" fill="#D97706"/>
  <rect x="76" y="68" width="4" height="30" rx="1.5" fill="#D97706"/>
  <rect x="82" y="71" width="4" height="27" rx="1.5" fill="#D97706"/>
  <rect x="88" y="69" width="4" height="29" rx="1.5" fill="#D97706"/>
  <text x="80" y="112" font-size="8" font-family="sans-serif" font-weight="bold" fill="#334155" text-anchor="middle">STIK</text>

  <!-- Toples Stik Pelangi -->
  <rect x="110" y="85" width="30" height="34" rx="4" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
  <rect x="114" y="68" width="4" height="30" rx="1.5" fill="#EF4444"/>
  <rect x="120" y="70" width="4" height="28" rx="1.5" fill="#10B981"/>
  <rect x="126" y="67" width="4" height="31" rx="1.5" fill="#3B82F6"/>
  <rect x="132" y="69" width="4" height="29" rx="1.5" fill="#F59E0B"/>
  <text x="125" y="112" font-size="7" font-family="sans-serif" font-weight="bold" fill="#334155" text-anchor="middle">WARNA</text>

  <!-- Botol Lem Kayu -->
  <path d="M165 118 L165 92 L172 85 L178 85 L185 92 L185 118 Z" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  <rect x="171" y="78" width="8" height="7" fill="#EF4444"/>
  <text x="175" y="106" font-size="7" font-family="sans-serif" font-weight="bold" fill="#1D4ED8" text-anchor="middle">LEM</text>

  <!-- Barang di Rak Bawah: Tempat Pensil Stik Jadi & Pita -->
  <!-- Mini Tempat Pensil Stik Miniatur -->
  <rect x="65" y="132" width="32" height="36" rx="3" fill="#FDE68A" stroke="#D97706" stroke-width="2"/>
  <!-- Pola Stik Dinding Tempat Pensil -->
  <line x1="65" y1="140" x2="97" y2="140" stroke="#B45309" stroke-width="1.5"/>
  <line x1="65" y1="148" x2="97" y2="148" stroke="#B45309" stroke-width="1.5"/>
  <line x1="65" y1="156" x2="97" y2="156" stroke="#B45309" stroke-width="1.5"/>
  <line x1="65" y1="164" x2="97" y2="164" stroke="#B45309" stroke-width="1.5"/>
  <!-- Pensil Warna di dalamnya -->
  <polygon points="72,122 75,115 78,122" fill="#EF4444"/>
  <rect x="72" y="122" width="6" height="15" fill="#FCA5A5"/>
  <polygon points="82,120 85,113 88,120" fill="#3B82F6"/>
  <rect x="82" y="120" width="6" height="17" fill="#93C5FD"/>

  <!-- Pita Hiasan Gulung -->
  <circle cx="125" cy="150" r="14" fill="#F472B6" stroke="#DB2777" stroke-width="2"/>
  <circle cx="125" cy="150" r="6" fill="#FDF2F8"/>

  <!-- Meja Etalase Utama Depan -->
  <rect x="40" y="195" width="420" height="85" rx="10" fill="url(#counter-grad)" stroke="#1E3A8A" stroke-width="2.5"/>
  <!-- Papan Kayu Atas Meja -->
  <rect x="35" y="185" width="430" height="15" rx="5" fill="#F59E0B" stroke="#B45309" stroke-width="2"/>

  <!-- Mesin Kasir di Meja -->
  <rect x="80" y="148" width="65" height="38" rx="6" fill="#475569" stroke="#1E293B" stroke-width="2"/>
  <rect x="88" y="153" width="49" height="16" rx="3" fill="#0F172A"/>
  <text x="112" y="165" font-family="monospace" font-size="10" font-weight="bold" fill="#22C55E" text-anchor="middle">10 + 10</text>
  <!-- Tombol Kasir -->
  <circle cx="94" cy="177" r="3" fill="#F59E0B"/>
  <circle cx="104" cy="177" r="3" fill="#3B82F6"/>
  <circle cx="114" cy="177" r="3" fill="#10B981"/>
  <circle cx="124" cy="177" r="3" fill="#EF4444"/>

  <!-- Keranjang Belanja Stik Siswa -->
  <rect x="290" y="152" width="85" height="34" rx="6" fill="#FEF08A" stroke="#EAB308" stroke-width="2"/>
  <!-- Gagang Keranjang -->
  <path d="M305 152 Q332 132 360 152" fill="none" stroke="#CA8A04" stroke-width="3"/>
  <!-- Isi Keranjang: 2 Ikat Stik 10 -->
  <g transform="translate(300, 140)">
    <rect x="0" y="0" width="22" height="20" rx="3" fill="#D97706" stroke="#92400E" stroke-width="1.5"/>
    <rect x="0" y="7" width="22" height="6" fill="#EF4444"/> <!-- Pita Ikat Merah -->
    <text x="11" y="12" font-size="6" font-family="sans-serif" font-weight="black" fill="#FFFFFF" text-anchor="middle">10</text>
  </g>
  <g transform="translate(330, 140)">
    <rect x="0" y="0" width="22" height="20" rx="3" fill="#D97706" stroke="#92400E" stroke-width="1.5"/>
    <rect x="0" y="7" width="22" height="6" fill="#EF4444"/> <!-- Pita Ikat Merah -->
    <text x="11" y="12" font-size="6" font-family="sans-serif" font-weight="black" fill="#FFFFFF" text-anchor="middle">10</text>
  </g>

  <!-- Banner Diskon Ramah Koperasi -->
  <rect x="180" y="215" width="140" height="42" rx="8" fill="#FFFFFF" stroke="#FBBF24" stroke-width="2"/>
  <text x="250" y="232" font-family="sans-serif" font-size="10" font-weight="900" fill="#1E3A8A" text-anchor="middle">PAKET STEAM KELAS 2</text>
  <text x="250" y="247" font-family="sans-serif" font-size="9" font-weight="bold" fill="#059669" text-anchor="middle">Stik Daur Ulang Bersih & Kokoh</text>
</svg>
