<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-glow-indah" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EDE9FE"/>
      <stop offset="100%" stop-color="#DDD6FE"/>
    </radialGradient>
    <linearGradient id="blazer-indah-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="skin-indah" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FED7AA"/>
      <stop offset="100%" stop-color="#FDBA74"/>
    </linearGradient>
    <linearGradient id="hair-indah-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
  </defs>

  <!-- Lingkaran Latar Belakang Lavender Ceria -->
  <circle cx="100" cy="100" r="92" fill="url(#bg-glow-indah)" stroke="#818CF8" stroke-width="4"/>

  <!-- Badan / Blazer Guru Ms. Indah (Indigo Elegan & Ramah) -->
  <path d="M40 185 C40 145 60 135 100 135 C140 135 160 145 160 185 Z" fill="#8B5CF6"/>
  
  <!-- Kemeja Putih Berkerah -->
  <path d="M82 135 L100 162 L118 135 Z" fill="#FFFFFF"/>
  <circle cx="100" cy="172" r="2.5" fill="#CBD5E1"/>

  <!-- Blazer Guru Indigo -->
  <path d="M45 185 C45 148 65 138 86 138 L92 185 Z" fill="url(#blazer-indah-grad)"/>
  <path d="M155 185 C155 148 135 138 114 138 L108 185 Z" fill="url(#blazer-indah-grad)"/>

  <!-- Kartu Tanda Pengenal Guru (Ms. Indah, S.Pd.) -->
  <rect x="62" y="152" width="18" height="12" rx="3" fill="#FDE047" stroke="#CA8A04" stroke-width="1"/>
  <text x="71" y="161" font-size="5.5" font-family="'Nunito', sans-serif" font-weight="900" fill="#4338CA" text-anchor="middle">INDAH</text>

  <!-- Leher -->
  <rect x="88" y="115" width="24" height="22" rx="4" fill="#FDBA74"/>

  <!-- Rambut Belakang (Kuncir / Cepol Anggun) -->
  <ellipse cx="100" cy="90" rx="46" ry="48" fill="url(#hair-indah-grad)"/>
  <circle cx="100" cy="40" r="16" fill="url(#hair-indah-grad)"/>
  <ellipse cx="100" cy="42" rx="17" ry="6" fill="#F43F5E"/> <!-- Ikat Rambut Merah Muda -->

  <!-- Kepala & Wajah Ceria Ms. Indah -->
  <ellipse cx="100" cy="90" rx="36" ry="38" fill="url(#skin-indah)"/>

  <!-- Telinga & Anting Mutiara Kecil -->
  <circle cx="64" cy="92" r="7.5" fill="#FDBA74"/>
  <circle cx="63" cy="96" r="2.5" fill="#FDE047"/>
  <circle cx="136" cy="92" r="7.5" fill="#FDBA74"/>
  <circle cx="137" cy="96" r="2.5" fill="#FDE047"/>

  <!-- Rambut Depan Rapi & Poni Manis -->
  <path d="M64 78 C64 50 80 44 100 44 C120 44 136 50 136 78 C128 62 116 56 100 56 C84 56 72 62 64 78 Z" fill="url(#hair-indah-grad)"/>
  <path d="M64 76 Q78 62 98 65 Q80 76 70 94 Z" fill="url(#hair-indah-grad)"/>
  <path d="M136 76 Q122 62 102 65 Q120 76 130 94 Z" fill="url(#hair-indah-grad)"/>

  <!-- Kacamata Guru Modis & Cerdas -->
  <rect x="74" y="80" width="22" height="17" rx="5" fill="none" stroke="#F43F5E" stroke-width="2.5"/>
  <rect x="104" y="80" width="22" height="17" rx="5" fill="none" stroke="#F43F5E" stroke-width="2.5"/>
  <line x1="96" y1="88" x2="104" y2="88" stroke="#F43F5E" stroke-width="2.5"/>
  <line x1="68" y1="87" x2="74" y2="87" stroke="#F43F5E" stroke-width="2"/>
  <line x1="126" y1="87" x2="132" y2="87" stroke="#F43F5E" stroke-width="2"/>

  <!-- Mata Ceria Berbinar Ramah -->
  <circle cx="85" cy="88" r="4.5" fill="#1E293B"/>
  <circle cx="86.5" cy="86.5" r="1.5" fill="#FFFFFF"/>
  <circle cx="115" cy="88" r="4.5" fill="#1E293B"/>
  <circle cx="116.5" cy="86.5" r="1.5" fill="#FFFFFF"/>

  <!-- Alis Melengkung Lembut -->
  <path d="M76 74 Q85 70 94 74" fill="none" stroke="#1E1B4B" stroke-width="2" stroke-linecap="round"/>
  <path d="M106 74 Q115 70 124 74" fill="none" stroke="#1E1B4B" stroke-width="2" stroke-linecap="round"/>

  <!-- Hidung Kecil Imut -->
  <path d="M99 94 Q100 97 103 97" fill="none" stroke="#EA580C" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Pipi Merona Merah Muda Ceria -->
  <ellipse cx="73" cy="97" rx="5" ry="3" fill="#FDA4AF" opacity="0.75"/>
  <ellipse cx="127" cy="97" rx="5" ry="3" fill="#FDA4AF" opacity="0.75"/>

  <!-- Senyum Ramah Hangat Guru -->
  <path d="M88 103 Q100 114 112 103" fill="none" stroke="#DC2626" stroke-width="3" stroke-linecap="round"/>
  <path d="M92 105 Q100 112 108 105" fill="#FFFFFF"/>

  <!-- Bintang Prestasi Kecil di Samping -->
  <path d="M165 45 L168 52 L176 53 L170 59 L172 67 L165 63 L158 67 L160 59 L154 53 L162 52 Z" fill="#FBBF24"/>
  <path d="M35 50 L37 55 L43 56 L39 60 L40 66 L35 63 L30 66 L31 60 L27 56 L33 55 Z" fill="#FBBF24"/>
</svg>
