<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <radialGradient id="char-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF9C3"/>
      <stop offset="100%" stop-color="#FEF08A"/>
    </radialGradient>
  </defs>

  <rect width="400" height="240" rx="16" fill="url(#char-glow)"/>

  <!-- ================= SITI (Kiri) ================= -->
  <g transform="translate(60, 20)">
    <!-- Badan / Baju Pink Siti -->
    <path d="M15 150 C15 120 30 110 55 110 C80 110 95 120 95 150 Z" fill="#EC4899"/>
    <!-- Kerah Baju -->
    <path d="M45 110 L55 125 L65 110 Z" fill="#FFFFFF"/>

    <!-- Leher -->
    <rect x="47" y="95" width="16" height="18" rx="3" fill="#FBBF24"/>

    <!-- Kepala -->
    <ellipse cx="55" cy="70" rx="30" ry="32" fill="#FCD34D"/>

    <!-- Kerudung / Jilbab Ceria atau Rambut Kuncir Dua Pita Merah -->
    <!-- Rambut Ceria -->
    <path d="M22 65 C20 35 40 25 55 25 C70 25 90 35 88 65 C80 48 70 42 55 42 C40 42 30 48 22 65 Z" fill="#1F2937"/>
    <!-- Kuncir Kiri -->
    <circle cx="20" cy="55" r="12" fill="#1F2937"/>
    <circle cx="22" cy="53" r="5" fill="#EF4444"/> <!-- Pita Merah -->
    <!-- Kuncir Kanan -->
    <circle cx="90" cy="55" r="12" fill="#1F2937"/>
    <circle cx="88" cy="53" r="5" fill="#EF4444"/> <!-- Pita Merah -->

    <!-- Mata Ceria Siti -->
    <circle cx="44" cy="68" r="4.5" fill="#1F2937"/>
    <circle cx="42.5" cy="66" r="1.5" fill="#FFFFFF"/>
    <circle cx="66" cy="68" r="4.5" fill="#1F2937"/>
    <circle cx="64.5" cy="66" r="1.5" fill="#FFFFFF"/>

    <!-- Pipi Pink Merona -->
    <ellipse cx="36" cy="78" rx="5" ry="3" fill="#F472B6" opacity="0.7"/>
    <ellipse cx="74" cy="78" rx="5" ry="3" fill="#F472B6" opacity="0.7"/>

    <!-- Senyum Siti -->
    <path d="M47 80 Q55 90 63 80" fill="#DC2626" stroke="#991B1B" stroke-width="1.5"/>

    <!-- Tangan Memegang Stik Es Krim Kuning -->
    <g transform="translate(85, 120) rotate(-20)">
      <rect x="-3" y="-22" width="7" height="35" rx="3" fill="#FBBF24" stroke="#D97706" stroke-width="1"/>
      <circle cx="0" cy="5" r="8" fill="#FCD34D"/>
    </g>

    <text x="55" y="185" font-family="'Fredoka', sans-serif" font-size="16" font-weight="900" fill="#BE185D" text-anchor="middle">Siti</text>
    <text x="55" y="202" font-family="sans-serif" font-size="10" font-weight="bold" fill="#6B7280" text-anchor="middle">Cermat Membaca & Menghitung</text>
  </g>

  <!-- ================= PENSIL & STIK TENGAH ================= -->
  <g transform="translate(175, 45)">
    <!-- Tempat Pensil Miniatur Stik Nyata -->
    <rect x="0" y="45" width="50" height="60" rx="5" fill="#FDE68A" stroke="#B45309" stroke-width="2.5"/>
    <line x1="0" y1="58" x2="50" y2="58" stroke="#D97706" stroke-width="2"/>
    <line x1="0" y1="70" x2="50" y2="70" stroke="#D97706" stroke-width="2"/>
    <line x1="0" y1="82" x2="50" y2="82" stroke="#D97706" stroke-width="2"/>
    <line x1="0" y1="94" x2="50" y2="94" stroke="#D97706" stroke-width="2"/>

    <!-- Pensil Warna di dalam wadah -->
    <polygon points="12,28 16,16 20,28" fill="#EF4444"/>
    <rect x="12" y="28" width="8" height="25" fill="#F87171"/>
    <polygon points="28,24 32,12 36,24" fill="#3B82F6"/>
    <rect x="28" y="24" width="8" height="28" fill="#60A5FA"/>

    <text x="25" y="125" font-family="'Fredoka', sans-serif" font-size="12" font-weight="bold" fill="#B45309" text-anchor="middle">STEAM</text>
  </g>

  <!-- ================= BENI (Kanan) ================= -->
  <g transform="translate(245, 20)">
    <!-- Badan / Kaos Merah Beni -->
    <path d="M15 150 C15 120 30 110 55 110 C80 110 95 120 95 150 Z" fill="#EF4444"/>
    <!-- Kerah Baju Kuning -->
    <path d="M45 110 L55 125 L65 110 Z" fill="#FDE047"/>

    <!-- Leher -->
    <rect x="47" y="95" width="16" height="18" rx="3" fill="#FBBF24"/>

    <!-- Kepala -->
    <ellipse cx="55" cy="70" rx="30" ry="32" fill="#FCD34D"/>

    <!-- Rambut Cowok Keren Beni -->
    <path d="M22 62 C22 35 40 26 55 26 C70 26 88 35 88 62 C80 44 72 40 55 40 C38 40 30 44 22 62 Z" fill="#4B5563"/>
    <path d="M30 40 Q40 24 55 35 Q70 24 78 40 Z" fill="#374151"/>

    <!-- Mata Ceria Beni -->
    <circle cx="44" cy="68" r="4.5" fill="#1F2937"/>
    <circle cx="42.5" cy="66" r="1.5" fill="#FFFFFF"/>
    <circle cx="66" cy="68" r="4.5" fill="#1F2937"/>
    <circle cx="64.5" cy="66" r="1.5" fill="#FFFFFF"/>

    <!-- Pipi Merona -->
    <ellipse cx="36" cy="78" rx="5" ry="3" fill="#FCA5A5" opacity="0.7"/>
    <ellipse cx="74" cy="78" rx="5" ry="3" fill="#FCA5A5" opacity="0.7"/>

    <!-- Senyum Lebar Beni -->
    <path d="M47 80 Q55 92 63 80" fill="#DC2626" stroke="#991B1B" stroke-width="1.5"/>

    <!-- Tangan Memegang Stik Es Krim Biru -->
    <g transform="translate(15, 120) rotate(20)">
      <rect x="-3" y="-22" width="7" height="35" rx="3" fill="#3B82F6" stroke="#1D4ED8" stroke-width="1"/>
      <circle cx="0" cy="5" r="8" fill="#FCD34D"/>
    </g>

    <text x="55" y="185" font-family="'Fredoka', sans-serif" font-size="16" font-weight="900" fill="#B91C1C" text-anchor="middle">Beni</text>
    <text x="55" y="202" font-family="sans-serif" font-size="10" font-weight="bold" fill="#6B7280" text-anchor="middle">Kreatif Merakit Stik</text>
  </g>
</svg>
